<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="hero">
          <span class="logo">A</span>
        </div>
        <div>
          <h1>Accounts Manager</h1>
          <p class="muted">Simple UI to create, list, update and delete accounts.</p>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Accounts</h2>
          <div id="listContainer">Loading...</div>
        </section>

        <section class="card" id="createCard">
          <h2>Create Account</h2>
          <label>Name</label>
          <input id="name" placeholder="Account name" />
          <label>Balance</label>
          <input id="balance" type="number" placeholder="0" />
          <div class="row">
            <button id="create">Create</button>
            <button id="refresh" class="secondary">Refresh</button>
          </div>
          <div id="createResult" class="muted"></div>
        </section>
      </div>

      <template id="rowTpl">
        <div class="row item">
          <div class="flex name"></div>
          <div class="actions">
            <button class="btn-get">Details</button>
            <button class="btn-edit">Edit</button>
            <button class="btn-del">Delete</button>
          </div>
        </div>
      </template>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
