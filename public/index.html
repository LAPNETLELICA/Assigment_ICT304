<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="hero">
          <span class="logo">A</span>
        </div>
        <div>
          <h1>Accounts Manager</h1>
          <p class="muted">Simple UI to create, list, update and delete accounts.</p>
        </div>
      </div>

      <div class="grid">
        <section class="card" id="authCard">
          <h2>Login / Sign up</h2>
          <label>Username</label>
          <input id="username" placeholder="your email or username" />
          <label>Password</label>
          <input id="password" type="password" placeholder="password" />
          <label>Role</label>
          <select id="role">
            <option value="client">Client</option>
            <option value="manager">Manager</option>
          </select>
          <div class="row">
            <button id="signup" class="secondary">Sign up</button>
            <button id="login">Login</button>
          </div>
          <div id="authResult" class="muted"></div>
        </section>

        <section class="card" id="dashboardCard" style="display:none">
          <h2>Your Dashboard</h2>
          <div style="margin-bottom:0.5rem">
            <button id="newAccount" class="secondary">Create Bank Account</button>
            <button id="logout" class="secondary">Logout</button>
          </div>
          <div id="listContainer">Loading...</div>
          <div id="createResult" class="muted"></div>
        </section>
      </div>

      <template id="rowTpl">
        <div class="row item">
          <div class="flex name"></div>
          <div class="actions">
            <button class="btn-get">Details</button>
            <button class="btn-edit">Edit</button>
            <button class="btn-del">Delete</button>
          </div>
        </div>
      </template>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
